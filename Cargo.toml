[package]
name = "cathedral-probe"
version = "0.2.0"
edition = "2021"
description = "Spectral topology analysis for microservice and component graphs — measure the health of the space between components"
license = "MIT"
repository = "https://github.com/SuperInstance/cathedral-probe"
keywords = ["topology", "graph", "spectrum", "laplacian", "microservices"]
categories = ["algorithms", "science"]

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
